<text x="2320" y="50" text-anchor="end" style="font-family:'Work Sans',sans-serif;font-size:18px;fill:#A3A5A6">Applicants in, a sourced read out. Kushal decides.</text>

<text x="420" y="118" class="col">2  GATHER</text>
<text x="800" y="118" class="col">3  JUDGE</text>

<rect x="40" y="460" width="330" height="180" rx="4" fill="#F8F6F1" stroke="#6B6E70" stroke-width="4"/><foreignObject x="40" y="460" width="330" height="180"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#6B6E70">DATA AND SYSTEMS</div><div class="t">Intake and checks</div><div class="b">Parse deck and form. Code compares numbers, team and funding between the two. Checks sector and stage labels. Rules, no model.</div></div></foreignObject>

<text x="820" y="168" class="aititle">AI SECTION: every point where the model uses judgment</text>
<text x="820" y="196" class="aisub">Claude generates. A different model judges in the evals. Each point has its own test cases.</text>

<text x="834" y="257" class="chip"><tspan class="chipn">01</tspan>  Thesis reconstruction</text>

<text x="834" y="333" class="chip"><tspan class="chipn">02</tspan>  Sector fit against the label</text>
<rect x="820" y="372" width="350" height="62" rx="4" fill="#F8F6F1" stroke="#1E7A4A" stroke-width="3"/>
<text x="834" y="409" class="chip"><tspan class="chipn">03</tspan>  Founder quality from evidence</text>
<rect x="820" y="448" width="350" height="62" rx="4" fill="#F8F6F1" stroke="#1E7A4A" stroke-width="3"/>
<text x="834" y="485" class="chip"><tspan class="chipn">04</tspan>  Path to market</text>
<rect x="820" y="524" width="350" height="62" rx="4" fill="#F8F6F1" stroke="#1E7A4A" stroke-width="3"/>
<text x="834" y="561" class="chip"><tspan class="chipn">05</tspan>  Does the source support the claim</text>
<rect x="820" y="600" width="350" height="62" rx="4" fill="#F8F6F1" stroke="#1E7A4A" stroke-width="3"/>
<text x="834" y="637" class="chip"><tspan class="chipn">06</tspan>  Is a deck-vs-form gap material</text>
<rect x="820" y="676" width="350" height="62" rx="4" fill="#F8F6F1" stroke="#1E7A4A" stroke-width="3"/>
<text x="834" y="713" class="chip"><tspan class="chipn">07</tspan>  Competitor definition applied</text>
<rect x="1185" y="220" width="350" height="62" rx="4" fill="#F8F6F1" stroke="#1E7A4A" stroke-width="3"/>
<text x="1199" y="257" class="chip"><tspan class="chipn">08</tspan>  Missing data: founder or search</text>

<text x="1199" y="409" class="chip"><tspan class="chipn">10</tspan>  Take call, Pass or Hold</text>

<rect x="800" y="800" width="700" height="130" rx="4" fill="#F8F6F1" stroke="#6B6E70" stroke-width="4"/><foreignObject x="800" y="800" width="700" height="130"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#6B6E70">DATA AND SYSTEMS</div><div class="t">Scoring matrix (rules in code)</div><div class="b">Points per criterion, total 100, plus gates: portfolio overlap = Hold, outside the areas = flag, stage mismatch = flag. Weights and thresholds tuned by the backtest.</div></div></foreignObject>

<rect x="1610" y="610" width="330" height="190" rx="4" fill="#F8F6F1" stroke="#B3261E" stroke-width="4"/><foreignObject x="1610" y="610" width="330" height="190"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#B3261E">HUMAN TAKES OVER</div><div class="t">Kushal reviews every outcome</div><div class="b">Yes, No or Hold on each. Nothing is auto-approved or auto-rejected. Hold is forced on: portfolio overlap, low confidence, stage mismatch.</div></div></foreignObject>
<rect x="1990" y="150" width="330" height="130" rx="4" fill="#F8F6F1" stroke="#1E7A4A" stroke-width="4"/><foreignObject x="1990" y="150" width="330" height="130"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#1E7A4A">AI</div><div class="t">Email agent</div><div class="b">Drafts: we&#x27;d like to schedule a meeting, does this time work?</div></div></foreignObject>

<rect x="1990" y="460" width="330" height="170" rx="4" fill="#F8F6F1" stroke="#6B6E70" stroke-width="4"/><foreignObject x="1990" y="460" width="330" height="170"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#6B6E70">DATA AND SYSTEMS</div><div class="t">Resend and calendar</div><div class="b">Sends the email. Proposes Tue or Thu 30-minute slots, Aditya for deeptech. Test mode: operator&#x27;s address only.</div></div></foreignObject>
<rect x="1990" y="670" width="330" height="140" rx="4" fill="#F8F6F1" stroke="#1E7A4A" stroke-width="4"/><foreignObject x="1990" y="670" width="330" height="140"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#1E7A4A">AI</div><div class="t">Reply handling</div><div class="b">Reads the founder&#x27;s reply: yes, no or another time. Proposes the next slot.</div></div></foreignObject>
<text x="40" y="992" class="col">6  LEARN AND PROVE</text>
<rect x="40" y="1010" width="1060" height="150" rx="4" fill="#F8F6F1" stroke="#6B6E70" stroke-width="4"/><foreignObject x="40" y="1010" width="1060" height="150"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#6B6E70">DATA AND SYSTEMS</div><div class="t">Eval harness</div><div class="b">About 300 test cases across every AI point, including dummy companies. Backtest on held-out memos with the decision and reasoning stripped. A different model judges. Pass and fail report, then root cause, fix and rerun. Production only after it passes.</div></div></foreignObject>
<rect x="1610" y="1010" width="710" height="150" rx="4" fill="#F8F6F1" stroke="#6B6E70" stroke-width="4"/><foreignObject x="1610" y="1010" width="710" height="150"><div xmlns="http://www.w3.org/1999/xhtml" class="n"><div class="tag" style="color:#6B6E70">DATA AND SYSTEMS</div><div class="t">Corrections store (Neon)</div><div class="b">Score and recommendation corrections and email-draft corrections, each with its one-line why. Retrieved for similar companies, capped, with a regression check on the earlier test cases.</div></div></foreignObject>
